<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critter Clash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critter Clash">
<script>window.CC_THREE_URL="three.min.js"</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--arena:#0F4C5C;--arena2:#0A3640;--panel:#FFF4D6;--panel2:#F8E3AE;--text:#14232A;--muted:#5B6B70;--line:#14232A;--hot:#FF4F5E;--gold:#FFC23D;--good:#3FD07A;
 --disp:"Bungee",Impact,"Arial Black",sans-serif;--ui:"Chakra Petch",system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--arena:#0B3B48;--arena2:#06232B;--panel:#20343A;--panel2:#2A444B;--text:#F4EBD3;--muted:#A9B8B9}}
:root[data-theme="dark"]{--arena:#0B3B48;--arena2:#06232B;--panel:#20343A;--panel2:#2A444B;--text:#F4EBD3;--muted:#A9B8B9}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:var(--ui);font-weight:600;color:var(--text);font-size:16px;line-height:1.4;
 background:var(--arena);background-image:radial-gradient(circle at 50% -10%,#1d7488 0,transparent 60%),repeating-linear-gradient(0deg,transparent 0 38px,rgba(255,255,255,.035) 38px 40px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.035) 38px 40px);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%}
.wrap{padding:8px 14px 40px}
.muted{color:var(--muted)}.small{font-size:13px}.sub{color:#D9EEF0;margin:6px 2px 12px}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:12px 14px;margin:14px 0}
.ph{font-family:var(--disp);font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:8px}
.ph small{font-family:var(--ui);font-size:13px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px 4px;color:#fff}
.bar h2{font-family:var(--disp);font-size:22px;margin:0;text-shadow:3px 3px 0 var(--line);letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:42px;height:42px;border-radius:12px;border:3px solid var(--line);background:var(--panel);color:var(--text);font-size:26px;line-height:1;box-shadow:3px 3px 0 var(--line);flex:none}
.big{display:block;width:100%;font-family:var(--disp);font-size:18px;padding:14px;border:3px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);box-shadow:4px 4px 0 var(--line);margin:10px 0;transition:transform .08s}
.big:active,.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.big.hot,.btn.hot{background:var(--hot);color:#fff;text-shadow:2px 2px 0 var(--line)}
.big.gold{background:var(--gold);color:#14232A}
.big.ghost,.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none}
.panel .btn.ghost{color:var(--text);border-color:var(--line)}
.big:disabled{opacity:.5}
.btn{font-family:var(--disp);font-size:14px;padding:9px 14px;border:3px solid var(--line);border-radius:12px;background:var(--panel2);box-shadow:3px 3px 0 var(--line)}
.inp{width:100%;font:inherit;font-size:18px;padding:12px;border:3px solid var(--line);border-radius:12px;background:#fff;color:#14232A}
.inp.code{font-family:var(--disp);font-size:28px;text-align:center;letter-spacing:8px;margin-bottom:4px}
.center{text-align:center}
.bigcode{font-family:var(--disp);font-size:56px;letter-spacing:10px;margin:0;color:var(--hot);text-shadow:4px 4px 0 var(--line)}
.st{font-size:17px}
/* home */
.home{padding:28px 16px 30px;text-align:center}
.logo{font-family:var(--disp);font-size:clamp(52px,17vw,84px);line-height:.88;margin:6px 0 8px;color:var(--gold);text-shadow:5px 5px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line);transform:rotate(-3deg)}
.logo span{display:block}.logo span+span{color:var(--hot);margin-left:.6em}
.tag{color:#D9EEF0;font-size:17px;margin:4px 0 16px}
.teamrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 14px}
.tm{background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:2px 2px 4px;box-shadow:3px 3px 0 var(--line)}
.tm b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamrow.small .tm b{font-size:10px}
.tm.pulse{animation:pulse 1s infinite alternate}
@keyframes pulse{to{background:var(--gold)}}
.menu{display:grid;gap:2px}
.rec{color:#D9EEF0;margin-top:14px}
.spr svg{display:block;width:100%;height:auto}
/* dex */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex:none;border:3px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel);font-size:14px}
.chip[aria-pressed="true"]{background:var(--tc);color:#fff;text-shadow:1px 1px 0 var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.card,.pcard{position:relative;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:4px 4px 8px;box-shadow:3px 3px 0 var(--line);text-align:center}
.card b,.pcard b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.in{background:var(--panel2)}
.lv{font-size:12px;color:var(--muted)}
.dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}.dots i,.hm>i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.intag{position:absolute;top:4px;left:4px;font-size:10px;background:var(--hot);color:#fff;border-radius:6px;padding:0 5px;border:2px solid var(--line)}
.solo{position:absolute;top:2px;right:6px;color:var(--gold);font-size:16px;text-shadow:1px 1px 0 var(--line)}
/* mon */
.hero{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center}
.bigspr{background:var(--panel2);border-radius:12px;border:3px solid var(--line)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.tb{background:var(--tc);color:#fff;border:2px solid var(--line);border-radius:8px;padding:1px 8px;font-size:13px;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.lvl{font-family:var(--disp);font-size:20px;margin:8px 0 4px}
.xp{height:10px;border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}.xp i{display:block;height:100%;background:var(--gold)}
.abil{margin:0}.abil b{font-family:var(--disp);font-weight:400;margin-right:4px}
.evo{display:flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.evo>div{flex:1;max-width:120px}.evo small{display:block;font-size:12px}.evo .locked .spr{filter:brightness(0);opacity:.35}
.arr{font-family:var(--disp);font-size:22px}
.stat{display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.stat div{height:12px;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.stat i{display:block;height:100%;background:var(--hot)}.stat b{text-align:right}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.slot{border:3px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--panel2);border-left:10px solid var(--tc);text-align:left}
.slot.sel{background:var(--gold);color:#14232A;transform:translateY(-2px);box-shadow:3px 3px 0 var(--line)}
.slot b{display:block;font-size:13px}.slot small{font-size:11px}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mv{width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:#14232A;position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:8px}
.mv .mt{grid-row:span 2;align-self:center;background:var(--tc);color:#fff;border-radius:6px;font-size:11px;padding:2px 6px;border:2px solid var(--line)}
.mv small{color:#5B6B70;font-size:12px}.mv.locked{opacity:.45}.mv.eq{background:#FFF0C2}
.eqm{position:absolute;right:8px;top:6px;font-size:11px;color:var(--hot)}
/* chart */
.tchart{overflow-x:auto}
.tchart table{border-collapse:collapse;font-size:12px;min-width:460px}
.tchart th span{display:inline-block;color:#fff;border-radius:6px;padding:1px 4px;border:2px solid var(--line);font-size:11px;white-space:nowrap}
.tchart td{width:34px;height:28px;text-align:center;border:1px solid rgba(20,35,42,.2)}
td.g2,b.g2{background:#3FD07A;color:#14232A}td.g5,b.g5{background:#FF9AA2;color:#14232A}b.g2,b.g5{padding:0 4px;border-radius:4px}
/* cpu */
.diff{display:grid;width:100%;text-align:left;gap:2px}
.diff b{font-family:var(--disp);font-size:22px;font-weight:400}.diff small{color:var(--hot)}
/* pick */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard.on{background:var(--gold);color:#14232A;transform:translateY(-3px)}
.ord{position:absolute;top:4px;left:4px;font-family:var(--disp);font-size:12px;background:var(--hot);color:#fff;border:2px solid var(--line);border-radius:6px;padding:0 5px}
.foe .pcard{background:var(--panel2)}
.wait{text-align:center;color:#fff;font-size:17px;padding:8px}
.panel .wait{color:var(--text)}
/* battle */
.battle{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.arena{position:relative;height:min(52vh,420px);overflow:hidden;background:linear-gradient(#7FD4E3 0,#BCEBF0 48%,#9BD07A 48%,#6FB35A 100%);border-bottom:4px solid var(--line)}
.plat{position:absolute;width:44%;height:14%;border-radius:50%;background:rgba(20,35,42,.18);border:3px solid rgba(20,35,42,.35)}
.plat.p1{right:4%;top:36%}.plat.p0{left:2%;bottom:5%}
.fighter{position:absolute;width:42%;max-width:220px;transition:opacity .4s}
.fighter.f1{right:5%;top:6%}.fighter.f0{left:3%;bottom:8%;width:48%;max-width:250px}
.fighter.f0 svg{transform:scaleX(-1)}
.fighter svg{display:block;width:100%;height:auto;overflow:visible}
.fighter.enter{animation:enter .45s ease-out}
@keyframes enter{from{transform:scale(.2);opacity:0}}
.fighter.lunge{animation:lunge1 .45s}.fighter.f0.lunge{animation:lunge0 .45s}
@keyframes lunge1{40%{transform:translate(-18%,14%)}}@keyframes lunge0{40%{transform:translate(18%,-14%)}}
.fighter.hit{animation:hit .5s}
@keyframes hit{0%,40%,80%{filter:brightness(2.6) saturate(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.fighter.faint{opacity:0;transform:translateY(30px);transition:opacity .6s,transform .6s}
.arena.shake{animation:ashake .35s}
@keyframes ashake{25%{transform:translate(5px,-3px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,2px)}}
.hud{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:6px 9px;width:min(56%,250px);z-index:2}
.hud.foe{left:3%;top:4%}.hud.me{right:3%;bottom:34%}
.hn{display:flex;justify-content:space-between;gap:6px;font-size:14px}.hn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpb{height:12px;border:2px solid var(--line);border-radius:6px;background:#2a3a40;overflow:hidden;margin:4px 0}
.hpb i{display:block;height:100%;background:var(--good);transition:width .45s ease}.hpb i.yel{background:var(--gold)}.hpb i.red{background:var(--hot)}
.hm{display:flex;align-items:center;gap:4px;font-size:12px}
.balls{display:inline-flex;gap:3px;margin-left:auto}.balls em{width:10px;height:10px;border-radius:50%;background:var(--hot);border:2px solid var(--line)}.balls em.ko{background:#999}
.hpn{margin-left:6px}
.stt{color:#fff;border-radius:5px;padding:0 5px;border:2px solid var(--line);font-size:11px;text-transform:capitalize}
.st-burn{background:#F06A2B}.st-poison{background:#9B4DCA}.st-shock{background:#E0A800}.st-freeze{background:#3BB6D6}.st-sleep{background:#6B7A80}
.fx{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--tc);border:3px solid var(--line);opacity:0;z-index:3;left:30%;top:60%}
.fx.go.up{animation:shotUp .45s ease-in}.fx.go.down{animation:shotDown .45s ease-in}
@keyframes shotUp{0%{left:28%;top:62%;opacity:1;transform:scale(.6)}100%{left:72%;top:22%;opacity:1;transform:scale(1.4)}}
@keyframes shotDown{0%{left:70%;top:22%;opacity:1;transform:scale(.6)}100%{left:26%;top:64%;opacity:1;transform:scale(1.4)}}
.dnum{position:absolute;font-family:var(--disp);font-size:26px;color:#fff;text-shadow:3px 3px 0 var(--line);z-index:4;animation:rise .9s ease-out forwards}
.dnum.d1{right:18%;top:12%}.dnum.d0{left:20%;bottom:30%}
@keyframes rise{to{transform:translateY(-36px);opacity:0}}
.msg{background:var(--panel);border-bottom:4px solid var(--line);padding:12px 16px;min-height:52px;font-size:17px}
.ctrl{padding:12px 12px 20px;flex:1}
.mvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mvb{position:relative;text-align:left;border:3px solid var(--line);border-radius:14px;background:var(--panel);border-left:12px solid var(--tc);box-shadow:4px 4px 0 var(--line);padding:10px 10px 10px 12px;min-height:66px}
.mvb b{display:block;font-family:var(--disp);font-weight:400;font-size:15px;line-height:1.15}.mvb small{font-size:12px;color:var(--muted)}
.mvb .mt{position:absolute;right:8px;bottom:6px;font-size:10px;color:var(--muted)}
.mvb:disabled{opacity:.45}.mvb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.se{color:#1d9b55;font-style:normal;font-weight:700}.nve{color:var(--hot);font-style:normal}
.bench{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.bn{background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:4px;width:110px;text-align:center}
.bn.sm{width:74px}.bn b{display:block;font-size:12px}.bn small{font-size:11px}.bn:disabled{opacity:.4}
.swl{color:#fff;font-family:var(--disp);font-size:13px}
.ask{color:#fff;font-family:var(--disp);margin:0 0 4px}
/* result */
.banner{font-family:var(--disp);font-size:clamp(48px,15vw,72px);text-align:center;margin:18px 0 0;color:var(--gold);text-shadow:5px 5px 0 var(--line);transform:rotate(-2deg)}
.banner.l{color:#B8C5C8}
.xpl{list-style:none;margin:0;padding:0}
.xpl li{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:2px dashed rgba(20,35,42,.2)}
.xpl li:last-child{border-bottom:0}
.up{color:#1d9b55}.evomsg{margin:2px 0;color:var(--hot);font-family:var(--disp);font-weight:400;font-size:14px}.newmv{margin:2px 0;font-size:13px}
.lang{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;border:3px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:3px 3px 0 var(--line)}
.lang button{border:0;background:var(--panel);padding:5px 10px;font-family:var(--disp);font-size:13px}.lang button[aria-pressed="true"]{background:var(--gold);color:#14232A}
.home{position:relative}
.ttl{color:var(--gold);font-family:var(--disp);margin:-6px 0 12px;text-shadow:2px 2px 0 var(--line)}
.progcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:10px 14px;margin:6px 0 14px}
.progcard .pc{display:flex;flex-direction:column}.progcard b{font-family:var(--disp);font-weight:400;font-size:16px}.progcard span{font-size:14px;color:var(--muted)}.progcard .inv{color:var(--text);margin-top:2px}
.ring{width:72px;flex:none;color:var(--text)}.ring svg{display:block;width:100%}.ring.big{width:110px}.ring.sm{width:90px;margin:0 auto 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two .big{font-size:14px;padding:12px 8px}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.itm{position:relative;text-align:left;border:3px solid var(--line);border-radius:12px;background:#fff;color:#14232A;padding:8px 10px;box-shadow:3px 3px 0 var(--line)}
.itm b{display:block;font-size:14px}.itm small{color:#5B6B70;font-size:12px}.itm em{position:absolute;right:8px;top:6px;font-style:normal;font-family:var(--disp);font-size:13px}
.itm.sh{background:#FFF0C2}.itm:disabled{opacity:.45;box-shadow:none}
.shy{color:#C98A00;font-family:var(--disp);margin:6px 0 0;font-size:14px}
.progtop{display:flex;align-items:center;gap:14px}
.pbar{position:relative;height:16px;border:3px solid var(--line);border-radius:9px;background:#fff;overflow:visible;margin:6px 0}
.pbar>i{display:block;height:100%;background:var(--gold);border-radius:6px}
.ms-bar{margin:14px 0 22px}
.ms{position:absolute;top:18px;transform:translateX(-50%);font-family:var(--disp);font-size:11px;color:var(--muted)}.ms.on{color:var(--hot)}
.msl,.ql,.nl{list-style:none;margin:0;padding:0}
.msl li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dashed rgba(20,35,42,.18)}.msl li:last-child{border:0}
.msl b{font-family:var(--disp);font-weight:400}.msl em,.ck{font-style:normal;color:#1d9b55;font-family:var(--disp);font-size:20px}.msl .done span{color:var(--muted)}
.ql{display:grid;gap:10px}
.ql li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line);padding:10px 12px}
.ql li>div{flex:1}.ql b{font-family:var(--disp);font-weight:400;font-size:15px}.ql p{margin:2px 0 6px;font-size:14px}
.ql li.done{background:var(--panel2);opacity:.75}
.qp{height:9px;border:2px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;margin:2px 0}.qp i{display:block;height:100%;background:var(--hot)}
.rw{display:block;font-size:12px;color:#B5582A;margin-top:4px}
#sheet{position:fixed;inset:0;background:rgba(6,26,32,.65);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
#sheet[hidden]{display:none}
.sheetin{background:var(--panel);border:3px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.nl li{padding:8px 0;border-bottom:2px dashed rgba(20,35,42,.18)}.nl li:last-child{border:0}.nl b{display:block}.nl small{color:#B5582A}
.nl li.nm b{color:var(--hot);font-family:var(--disp);font-weight:400}
.gotp{background:#FFF0C2}
.big.lbl{text-align:center;cursor:pointer}
select.inp{appearance:auto}
textarea.inp{font-size:13px;margin-top:10px;font-family:ui-monospace,monospace}
.arena3d{background:#0B3944}
.arena3d .hud.me{bottom:4%;right:3%}.arena3d .hud.foe{top:4%;left:3%}
.arena3d .fighter,.arena3d .plat,.arena3d .fx{display:none}
.c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.arena .hud{z-index:3}.arena .dnum{z-index:4}
.bigspr{position:relative;aspect-ratio:1;overflow:hidden}.bigspr.on{background:radial-gradient(circle at 50% 40%,#fff8e4,#f3dfae)}
.bigspr.on .spr{display:none}.bigspr .c3d{cursor:grab}
.rowl{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin:8px 0}
.rowl input{width:100%;accent-color:var(--hot)}
.token{font-family:var(--disp);font-size:24px;margin:2px 0 10px;color:var(--hot);word-break:break-all}

  // face
  const es=Math.floor(R()*4),ex=rx*(.3+R()*.1),ey=cy-ry*.2,er=(3.6+R()*2.2)*Math.sqrt(sc)*(st===0&&!s.solo?1.15:1);

const MILESTONES=[{p:25,r:{cl:2}},{p:50,r:{sh:2}},{p:75,r:{cl:3,title:"veteran"}},{p:100,r:{sh:3,title:"grandmaster"}}];
function progressPct(){return Math.round(Object.keys(SAVE.done).length/Q.length*100)}
function rewardText(r){const b=[];if(r.cs)b.push(r.cs+"× "+tr("candy_s"));if(r.cm)b.push(r.cm+"× "+tr("candy_m"));if(r.cl)b.push(r.cl+"× "+tr("candy_l"));if(r.sh)b.push(r.sh+"× "+tr("shinytok"));if(r.title)b.push(tr("title")+" « "+titleName(r.title)+" »");return b.join(", ")}
function grant(r){const v=SAVE.inv;if(r.cs)v.cs+=r.cs;if(r.cm)v.cm+=r.cm;if(r.cl)v.cl+=r.cl;if(r.sh)v.sh+=r.sh;if(r.title&&!SAVE.titles.includes(r.title)){SAVE.titles.push(r.title);if(!SAVE.title)SAVE.title=r.title}}
// returns list of newly completed {q, kind:'q'|'c'|'m'}
function checkQuests(sum){
  const got=[];
  for(const q of Q){if(SAVE.done[q.id])continue;let ok=false;
    if(q.p){const [c,t]=q.p();ok=c>=t}else if(q.b&&sum){try{ok=!!q.b(sum)}catch(e){ok=false}}
    if(ok){SAVE.done[q.id]=Date.now();grant(q.r);got.push({q,kind:q.k})}}
  const pct=progressPct();
  for(const m of MILESTONES){if(pct>=m.p&&!SAVE.ms.includes(m.p)){SAVE.ms.push(m.p);grant(m.r);got.push({m,kind:"m"})}}
  return got;
}

const _creatureEvo=creature3D;
creature3D=function(sp,stage,sh){const g=_creatureEvo(sp,stage,sh),s=SPECIES[sp];if(s.solo||!stage)return g;const T=G3.T,R=mulberry(sp*7717+stage*131),inner=g.children[0];
  g.updateMatrixWorld(true);const bb=new T.Box3().setFromObject(inner),top=bb.max.y,back=bb.min.z,side=bb.max.x,mid=(bb.max.y+bb.min.y)/2,front=bb.max.z;
  const hs=(R()<.5?-1:1)*(stage===1?.06:.13),ss=stage===1?.08:.15;
  inner.traverse(o=>{if(o.isMesh&&o.material&&o.material.isMeshToonMaterial&&!o.userData.evo){o.material=o.material.clone();o.material.color.offsetHSL(hs,ss,stage===2?-.05:0)}});
  const base=new T.Color(TCOL[s.t[0]]).offsetHSL(hs,ss,-.1).getHex(),acc=new T.Color(TCOL[s.t[1]||s.t[0]]).offsetHSL(-hs,.1,.05).getHex(),ivory=0xf3ead2,dark=0x2a2430;
  const P=(geo,col,o)=>{const m=part(inner,geo,col,o);m.userData.evo=1;return m};
  const F={
   horns(){for(const sx of[-1,1]){const h=P(new T.ConeGeometry(.09,.5+R()*.25,10),R()<.5?ivory:dark,{p:[sx*side*.42,top-.05,front*.2],r:[-.35,0,-sx*.45]});h.scale.set(1,1,.8)}},
   crest(){const n=4+stage;for(let i=0;i<n;i++)P(new T.ConeGeometry(.12,.38-i*.03,4),acc,{p:[0,top-.05-i*.12,back*.35-i*.12],s:[.35,1,1],r:[-.6-i*.12,0,0]})},
   wings(){if(s.t.includes("Wind"))return;for(const sx of[-1,1])P(new T.SphereGeometry(1,16,10),acc,{p:[sx*side*.9,mid+.35,back*.6],s:[.6+stage*.15,.32,.05],r:[0,sx*.5,sx*.5]})},
   tailblade(){P(new T.ConeGeometry(.16,.8,6),base,{p:[0,mid*.6,back-.35],r:[-1.25,0,0],s:[1,1,.35]})},
   armor(){for(const sx of[-1,1])P(new T.SphereGeometry(.28,14,10,0,6.29,0,Math.PI/2),0x9aa0aa,{p:[sx*side*.82,mid+.25,0],r:[0,0,-sx*.9],s:[1,.6,1]});P(new T.SphereGeometry(.4,16,10,0,6.29,0,Math.PI/2),0x9aa0aa,{p:[0,top-.12,back*.3],s:[1.1,.45,1]})},
   mane(){const n=10;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;P(new T.SphereGeometry(.12,10,8),acc,{p:[Math.cos(a)*side*.7,top-.25+Math.sin(a*2)*.05,Math.sin(a)*side*.55-.1],s:[1,1.4,1]})}},
   spikes(){for(let i=0;i<5+stage;i++){const a=(i/(4+stage)-.5)*1.8;P(new T.ConeGeometry(.07,.32,6),dark,{p:[Math.sin(a)*side*.75,mid+.2+Math.cos(a)*.25,back*.75],r:[-.9,0,-a*.8]})}},
   marks(){for(let i=0;i<4;i++){const m=new T.Mesh(new T.SphereGeometry(.06,10,8),new T.MeshBasicMaterial({color:acc}));m.position.set((i%2?1:-1)*side*.93,mid+(i<2?.15:-.15),front*.15);m.scale.set(.4,1.4,1);m.userData.evo=1;inner.add(m)}},
   fins(){for(const sx of[-1,1])P(new T.ConeGeometry(.2,.6,4),acc,{p:[sx*side*.95,mid,back*.3],r:[0,0,-sx*1.25],s:[1,1,.25]})}};
  const keys=Object.keys(F),pool=[...keys].sort(()=>R()-.5),n=stage===1?1:2+(R()<.5?1:0);pool.slice(0,n).forEach(k=>F[k]());
  if(stage===2){const arch=Math.floor(R()*3);inner.scale.multiply(arch===0?new T.Vector3(.9,1.28,.92):arch===1?new T.Vector3(1.24,.96,1.18):new T.Vector3(.84,1.18,1.12))}
  else inner.scale.multiply(new T.Vector3(.95,1.14,.98));
  g.userData.h=(g.userData.h||2)*(stage===2?1.25:1.12);return g};

  const s=Object.assign(f,o);s.v=2;
  s.inv=Object.assign(freshSave().inv,o.inv||{});s.st=Object.assign(freshSave().st,o.st||{});s.st.cpuW=(o.st&&Array.isArray(o.st.cpuW))?o.st.cpuW:[0,0,0];

  if(o.w!=null&&!(o.st&&o.st.wins)){s.st.wins=o.w|0;s.st.losses=o.lo|0}
  SPECIES.forEach((sp,i)=>{const m=s.mons[i]||{};const l=Math.max(1,Math.min(50,m.l|0||5));
    s.mons[i]={l,x:Math.max(0,m.x|0),m:(Array.isArray(m.m)?m.m:[]).filter(id=>MOVES[id]&&learned(i,l).includes(id)).slice(0,3)};if(!s.mons[i].m.length)s.mons[i].m=defaultMoves(i,l)});

  for(let i=0;s.team.length<6;i++)if(!s.team.includes(i))s.team.push(i);

let BC=null;
function startBattle(o){
  const B=newBattle(o.seed,o.sides[0],o.sides[1]);
  BC={...o,B,acts:[[],[]],queue:[],busy:false,hold:true,view:null,done:false,trk:{act:[0,0],kos:{},se:0,crits:0,statusInfl:0,switches:0,statusMoves:0,blocks:0,healed:0,lastBreath:0}};

  go("battle");track(B.startEvents);BC.queue.push({k:"msg",t:tr("arena",{a:arenaName(BC.arena)})},...B.startEvents);

function track(ev){const T=BC.trk,me=BC.mySide;
  for(const e of ev){
    if(e.k==="enter")T.act[e.s]=e.i;
    else if(e.k==="faint"&&e.s!==me){const i=T.act[me];T.kos[i]=(T.kos[i]||0)+1}
    else if(e.k==="eff"&&e.se&&e.s!==me)T.se++;
    else if(e.k==="crit"&&e.s===me)T.crits++;
    else if(e.k==="status"&&e.s!==me)T.statusInfl++;
    else if(e.k==="recall"&&e.s===me)T.switches++;
    else if(e.k==="use"&&e.s===me&&MOVES[e.move].p===0)T.statusMoves++;
    else if(e.k==="block"&&e.s===me)T.blocks++;
    else if(e.k==="heal"&&e.s===me)T.healed+=e.amt;
    else if(e.k==="ab"&&e.ab==="lastbreath"&&e.s===me)T.lastBreath++;
  }}

function drawCtrl(){
  const c=$("#ctrl");if(!c)return;const B=BC.B,s=BC.mySide;
  if(BC.busy){c.innerHTML="";return}

  if(!B.need[s]||BC.acts[s].length>B.used[s]){c.innerHTML=`<p class="wait">${tr("waitopp")}</p>`;return}
  const me=B.sides[s].mons[B.sides[s].act];
  const bench=B.sides[s].mons.map((m,i)=>({m,i})).filter(x=>x.i!==B.sides[s].act);
  if(B.phase==="replace"){

  }

function myAction(v){
  if(!BC||BC.busy)return;const s=BC.mySide,B=BC.B;
  if(!B.need[s]||BC.acts[s].length>B.used[s])return;
  BC.acts[s].push(v);
  if(BC.mode!=="duel"){const o=1-s;if(B.need[o]&&BC.acts[o].length<=B.used[o])BC.acts[o].push(aiChoose(B,o,BC.meta.smart))}
  else duelPushActs();
  drawCtrl();advance();
}
function advance(){
  if(!BC)return;const B=BC.B;
  while(!B.over){
    const ready=[0,1].every(s=>!B.need[s]||BC.acts[s].length>B.used[s]);if(!ready)break;
    const a=[0,1].map(s=>B.need[s]?BC.acts[s][B.used[s]]:null),needed=[...B.need];
    const ev=step(B,a);[0,1].forEach(s=>{if(needed[s])B.used[s]++});
    track(ev);enqueue(ev);
    if(BC.mode!=="duel"){const o=1-BC.mySide;if(!B.over&&B.phase==="replace"&&B.need[o]&&BC.acts[o].length<=B.used[o])BC.acts[o].push(aiChoose(B,o,BC.meta.smart))}
  }
}

function finishBattle(){
  const B=BC.B,s=BC.mySide,win=B.winner===s,draw=B.winner<0,S=SAVE.st,T=BC.trk;
  const mine=B.sides[s].mons,foes=B.sides[1-s].mons,kos=foes.filter(m=>m.hp<=0).length;
  const mult=(win?1.5:draw?1:.5)*(BC.meta.xp||1.3);
  const fighters=mine.map(m=>m.sp);
  if(win){S.wins++;S.streak++;S.best=Math.max(S.best,S.streak);if(BC.mode==="cpu")S.cpuW[BC.meta.di]++}else{S.streak=0;if(!draw)S.losses++}
  if(BC.mode==="duel"){S.duels++;if(win)S.duelW++;const T=DUEL.theirs,f=T&&T.pid&&friendBy(T.pid);if(f){if(win)f.w++;else if(!draw)f.l++;f.last=Date.now();f.title=T.title||"";if(T.nick)f.name=cleanName(T.nick)}}
  S.kos+=kos;fighters.forEach(sp=>S.used[sp]=1);
  const report=[];
  SAVE.team.forEach(sp=>{const base=Math.round((kos*lvlOf(sp)*10+20)*mult);report.push(gainXp(sp,fighters.includes(sp)?base:Math.round(base/2)))});
  const alive=mine.filter(m=>m.hp>0),allT=mine.map(m=>SPECIES[m.sp].t),flat=allT.flat();
  const sum={win,draw,mode:BC.mode,di:BC.meta.di,turns:B.turn,myFainted:mine.length-alive.length,alive:alive.length,lastPct:alive.length===1?alive[0].hp/alive[0].maxhp*100:100,
    mono:allT[0].some(t=>allT.every(ts=>ts.includes(t))),rainbow:new Set(flat).size===flat.length,minLv:Math.min(...mine.map(m=>m.lvl)),
    mySolo:mine.filter(m=>SPECIES[m.sp].solo).length,foeSolo:foes.filter(m=>SPECIES[m.sp].solo).length,sweep:Math.max(0,...Object.values(T.kos)),
    se:T.se,crits:T.crits,statusInfl:T.statusInfl,switches:T.switches,statusMoves:T.statusMoves,blocks:T.blocks,healed:T.healed,lastBreath:T.lastBreath};
  let st=null;if(BC.mode==="story"){const s=BC.meta.story.step;storyInit();if(win){const first=SAVE.saga.step===s;st={step:s,first,post:first?(SAGA[s].post||[]):[]};advanceStep(s)}else st={step:s,lost:1}}
  const got=checkQuests(sum);
  const tlx=(win?60:20)+(st&&st.first?150:0)+got.length*40,tl=gainTrainerXp(tlx);
  save();BC.report={win,draw,list:report,got,story:st,tl,tlx};
}
function gainXp(sp,amt){
  const m=mon(sp),before={l:m.l,st:stageOf(sp,m.l)},learnedNow=[];
  if(m.l<50){m.x+=amt;while(m.l<50&&m.x>=xpNeed(m.l)){m.x-=xpNeed(m.l);m.l++;learnset(sp).forEach(([lv,id])=>{if(lv===m.l){learnedNow.push(id);if(m.m.length<3&&!m.m.includes(id))m.m.push(id)}})}if(m.l>=50){m.l=50;m.x=0}}
  const evo=stageOf(sp,m.l)>before.st;if(evo)SAVE.st.evos+=stageOf(sp,m.l)-before.st;
  return {sp,amt,from:before.l,to:m.l,evo:evo?{from:spName(sp,before.l),to:spName(sp,m.l)}:null,moves:learnedNow};
}

async function makeTransport(code,onT,onS){
  const name="cc-"+code.toLowerCase();
  if(window.claude&&claude.use){
    const room=await claude.use("room");
    if(room){
      const r=await room.join(name);let me=null,them=null;
      onS("waitfriend");
      r.onPeers(ch=>{const ps=ch.peers;me=ps.find(p=>p.sameTab)||me;const o=ps.find(p=>!p.sameTab&&p.presence&&p.presence.app==="cc");
        if(o){if(!them)onS("connected");them=o;onT(o.presence)}else{if(them){them=null;onT(null)}onS("waitfriend")}});
      return {send:o=>r.presence(o).catch(()=>{}),amFirst:()=>(me&&them?me.peer<them.peer:true),close:()=>r.leave()};
    }
  }
  if(!window.Peer){await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";s.onload=res;s.onerror=()=>rej(new Error("offline"));document.head.appendChild(s)})}
  return await new Promise((res,rej)=>{
    const hostId="critterclash-v2-"+code.toLowerCase();let conn=null,last=null,isHost=false,peer=null,timer=null;
    const wire=c=>{conn=c;c.on("open",()=>{onS("connected");if(last)c.send(last)});c.on("data",d=>onT(d));c.on("close",()=>{onT(null);onS("oppleft")})};
    const api={send:o=>{last=o;if(conn&&conn.open)conn.send(o)},amFirst:()=>isHost,close:()=>{clearInterval(timer);peer&&peer.destroy()}};
    timer=setInterval(()=>{if(conn&&conn.open&&last)conn.send(last)},2500);
    peer=new Peer(hostId);
    peer.on("open",()=>{isHost=true;onS("waitfriend");peer.on("connection",c=>{if(conn&&conn.open)return c.close();wire(c)});res(api)});
    peer.on("error",err=>{if(err.type==="unavailable-id"){peer.destroy();peer=new Peer();peer.on("open",()=>{wire(peer.connect(hostId,{reliable:true}));onS("joining");res(api)});peer.on("error",e=>rej(e))}else rej(err)});
  });
}

  const s=$("#sheet");s.innerHTML=`<div class="sheetin"><p><b>${tr("copythis")}</b></p><textarea class="inp" rows="6" readonly id="shtxt">${esc(full)}</textarea><button class="big hot" data-a="closesheet">OK</button></div>`;s.hidden=false;const ta=$("#shtxt");ta.focus();ta.select();
}
function shareFriendCode(){ensurePid();const u=appURL();shareMsg(tr("msg_friend",{n:cleanName(SAVE.nick)||tr("trainer"),t:myToken()}),null)}
function challengeFriend(f){
  ensurePid();if(!cleanName(SAVE.nick)){toast(tr("setname"));go("set");return}
  const L="ABCDEFGHJKLMNPQRSTUVWXYZ",code=Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join(""),u=appURL();
  shareMsg(tr("msg_duel",{n:cleanName(SAVE.nick),c:code}),null).then(()=>openRoom(code));
}
function handlePasted(t){
  try{t=t+" "+decodeURIComponent(t)}catch(e){}
  const room=parseRoom(t),tok=parseToken(t);let any=false;
  if(room){const nm=(t.match(/^\s*(.{1,16}?)\s+(?:te défie|challenges you)/i)||[])[1];SAVE.reqs.unshift({k:"c",code:room,name:tok?tok.name:cleanName(nm||""),id:tok?tok.id:"",at:Date.now()});any=true}
  else if(tok&&tok.id!==SAVE.pid&&!friendBy(tok.id)){SAVE.reqs.unshift({k:"f",name:tok.name,id:tok.id,at:Date.now()});any=true}
  else if(tok&&friendBy(tok.id)){toast(tr("already"));return true}
  if(any){dedupeReqs();save()}return any;
}
function dedupeReqs(){const seen=new Set();SAVE.reqs=SAVE.reqs.filter(r=>{const k=r.k+(r.code||"")+r.id;if(seen.has(k))return false;seen.add(k);return Date.now()-r.at<(r.k==="c"?864e5:30*864e5)}).slice(0,30)}
(function readLink(){try{
  ensurePid();const q=new URLSearchParams(location.search);let hit=false;
  if(q.get("friend"))hit=handlePasted(q.get("friend"))||hit;
  if(q.get("duel"))hit=handlePasted("room: "+q.get("duel")+" "+(q.get("from")||""))||hit;
  if(hit){history.replaceState(null,"",location.pathname);setTimeout(()=>go("friends",{tab:"r"}),50)}
}catch(e){}})();
function friendsV(){
  ensurePid();dedupeReqs();const tab=scrData.tab||(SAVE.reqs.length&&!SAVE.friends.length?"r":"f");
  const fl=SAVE.friends.slice().sort((a,b)=>(b.last||0)-(a.last||0));
  return topbar(tr("friends"))+`<div class="wrap">
  <div class="panel"><div class="ph">${tr("mycode")}</div><p class="token">${esc(myToken())}</p>
   ${cleanName(SAVE.nick)?"":`<p class="muted small">${tr("setnamehint")}</p>`}
   <div class="two"><button class="btn hot" data-a="sharecode">${tr("sharecode")}</button><button class="btn" data-a="copycode2">${tr("copy")}</button></div></div>
  <div class="panel"><div class="ph">${tr("addfriend")} <small>${tr("addhint")}</small></div><textarea id="fpaste" class="inp" rows="2" placeholder="${tr("pasteplace")}"></textarea><button class="btn" data-a="fpaste" style="margin-top:8px">${tr("addbtn")}</button></div>
  <div class="chips"><button class="chip" data-a="ftab" data-t="f" aria-pressed="${tab==="f"}" style="--tc:#FF4F5E">${tr("friends")} ${SAVE.friends.length}</button><button class="chip" data-a="ftab" data-t="r" aria-pressed="${tab==="r"}" style="--tc:#FF4F5E">${tr("requests")} ${SAVE.reqs.length}</button></div>
  ${tab==="f"?(fl.length?`<ul class="fl">${fl.map(f=>`<li><div class="fi"><b>${esc(f.name)}</b>${f.title&&TITLES[f.title]?`<small> « ${esc(titleName(f.title))} »</small>`:""}<span class="muted small">${tr("record",{w:f.w,l:f.l})}</span></div>
     <button class="btn hot" data-a="fduel" data-id="${f.id}">${tr("challenge")}</button><button class="x" data-a="fdel" data-id="${f.id}" aria-label="${tr("removefriend")}">✕</button></li>`).join("")}</ul>`:`<p class="emptyp">${tr("nofriends")}</p>`)
   :(SAVE.reqs.length?`<ul class="fl">${SAVE.reqs.map((r,i)=>`<li><div class="fi"><b>${r.k==="c"?tr("req_duel",{n:esc(r.name||tr("trainer"))}):tr("req_friend",{n:esc(r.name)})}</b><span class="muted small">${r.k==="c"?tr("roomis",{c:r.code}):esc(r.name+"#"+r.id)}</span></div>
     <button class="btn hot" data-a="racc" data-i="${i}">${tr("accept")}</button><button class="x" data-a="rdec" data-i="${i}" aria-label="${tr("decline")}">✕</button></li>`).join("")}</ul>`:`<p class="emptyp">${tr("noreqs")}</p>`)+`<p class="muted small" style="color:#D9EEF0">${tr("ioshint")}</p>`}
  </div>`;
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const a=el.dataset.a,d=el.dataset;
  if(el.classList.contains("back"))SFX.back();else if(a==="act"||a==="lock"||a==="pick")SFX.select();else SFX.tap();
  if(a==="go"){if(d.to==="duel"&&screen==="duel"&&DUEL.code)leaveRoom();if(d.to==="home"&&BC&&BC.mode==="cpu")BC=null;go(d.to)}
  if(a==="lang"){LANG=d.l;SAVE.lang=d.l;save();render()}
  if(a==="mon"){slotSel=0;go("mon",{sp:+d.sp})}
  if(a==="filter"){dexFilter=d.t;render()}
  if(a==="team")go("dex",{replaceFor:+scrData.sp});
  if(a==="unteam")toast(tr("need6"));
  if(a==="replace"){const sp=scrData.replaceFor;SAVE.team[+d.i]=sp;save();toast(tr("joined",{a:spName(sp,lvlOf(sp))}));go("mon",{sp})}
  if(a==="cancelrep")go("dex");
  if(a==="slot"){slotSel=+d.i;render()}
  if(a==="equip"){const m=mon(scrData.sp),id=d.id,before=m.m.join();const at=m.m.indexOf(id);if(at>=0){if(at!==slotSel&&m.m[slotSel]){[m.m[at],m.m[slotSel]]=[m.m[slotSel],m.m[at]]}}else{m.m[slotSel]=id}m.m=m.m.filter(Boolean);
    if(m.m.join()!==before)SAVE.st.edits++;slotSel=Math.min(2,slotSel+1);const got=checkQuests();save();render();notify(got)}
  if(a==="candy"){const sp=scrData.sp,k=d.k;if(SAVE.inv[k]<=0||lvlOf(sp)>=50)return;SAVE.inv[k]--;SAVE.st.candy++;const r=gainXp(sp,CANDY_XP[k]);
    const got=checkQuests();save();render();if(r.evo)SFX.evolve();else if(r.to>r.from)SFX.levelup();if(r.evo)toast(tr("evolved",{a:r.evo.from,b:r.evo.to}));else if(r.to>r.from)toast(spName(sp,r.to)+" : "+tr("lv")+" "+r.from+" → "+r.to);notify(got)}
  if(a==="shiny"){const sp=scrData.sp;if(SAVE.inv.sh<=0||SAVE.shiny[sp])return;SAVE.inv.sh--;SAVE.shiny[sp]=1;SAVE.st.shinyMade++;const got=checkQuests();save();render();notify(got)}
  if(a==="closesheet"){$("#sheet").hidden=true;render()}
  if(a==="ptab"){scrData.tab=d.t;render()}
  if(a==="cpu")startCpu(+d.i);
  if(a==="pick"){const i=+d.i,s=scrData.sel,k=s.indexOf(i);if(k>=0)s.splice(k,1);else if(s.length<3)s.push(i);render()}
  if(a==="lock"){
    if(scrData.mode==="cpu"){const foe=scrData.foe;const mine=scrData.sel.map(i=>scrData.mine[i]);
      const theirs=foe.map(f=>({f,v:Math.max(...mine.map(m=>Math.max(...f.moves.map(id=>MOVES[id].p?effOf(MOVES[id].t,SPECIES[m.sp].t):0))))+Math.random()})).sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.f);
      startBattle({mode:"cpu",seed:(Math.random()*4294967295)>>>0,sides:[mine,theirs],mySide:0,meta:{di:scrData.di,smart:DIFF[scrData.di].smart,xp:DIFF[scrData.di].xp}})}
    else if(scrData.mode==="story"){const s=scrData.step,N=SAGA[s].battle;startBattle({mode:"story",seed:(Math.random()*4294967295)>>>0,arena:SAGA[s].arena||4,sides:[scrData.sel.map(i=>scrData.mine[i]),scrData.foe],mySide:0,meta:{smart:N.smart,xp:1.3,boss:!!N.final,story:{step:s}}})}
    else{DUEL.mine.pick=[...scrData.sel];DUEL.mine.acts="";pushMine();scrData.locked=true;render();onTheirs(DUEL.theirs)}
  }
  if(a==="act")myAction(d.v);
  if(a==="toresult"){go("result");const r=BC&&BC.report;if(r){if(r.list.some(x=>x.evo))setTimeout(()=>SFX.evolve(),400);else if(r.list.some(x=>x.to>x.from))setTimeout(()=>SFX.levelup(),400);setTimeout(()=>auMusic("menu"),2600)}}
  if(a==="mkroom"){const L="ABCDEFGHJKLMNPQRSTUVWXYZ";openRoom(Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join(""))}
  if(a==="joinroom"){const c=($("#code").value||"").toUpperCase().replace(/[^A-Z]/g,"");if(c.length!==4){toast(tr("code4"));return}openRoom(c)}
  if(a==="leaveroom"){leaveRoom();go("duel")}
  if(a==="rematch"){if(!DUEL.mine){go("duel");return}BC=null;DUEL.mine.round++;DUEL.mine.pick=null;DUEL.mine.acts="";DUEL.mine.team=encTeam();DUEL.mine.seed=(Math.random()*4294967295)>>>0;pushMine();
    if(DUEL.theirs)go("pick",{mode:"duel",foe:decTeam(DUEL.theirs.team),mine:decTeam(DUEL.mine.team),sel:[]});else go("duel")}
  if(a==="leavebattle"){if(BC&&BC.mode==="duel")leaveRoom();BC=null;go("home")}
  if(a==="sagastep")openStep(+d.i);
  if(a==="sretry")storyPick(+d.s);
  if(a==="dnext"){const D=scrData;if(D.i<D.lines.length-1){D.i++;render();return}
    if(D.then==="fight")storyPick(D.step);else if(D.then==="mg")go("mg",{id:SAGA[D.step].mg,step:D.step});
    else{if(D.end)toast(tr("sagaend"));go("saga")}}
  if(a==="spost"){const st=BC&&BC.report&&BC.report.story;BC=null;if(!st||!st.post.length)return go("saga");go("dialog",{lines:st.post,i:0,then:"saga",end:SAVE.saga.step>=SAGA.length})}
  if(a==="mggo")mgStart();
  if(a==="mgretry")go("mg",{id:scrData.id,step:scrData.step});
  if(a==="mgnext"){const n=SAVE.saga.step;if(n<SAGA.length)openStep(n);else go("saga")}
  if(a==="mgquit")go("saga");
  if(a==="setav"){const v=d.av||"";SAVE.avatar=v.startsWith("h:")||v.startsWith("o:")?v:+v;if(v.startsWith("h:"))SAVE.lastHuman=v.slice(2);save();render()}
  if(a==="ftab"){scrData.tab=d.t;render()}
  if(a==="sharecode")shareFriendCode();
  if(a==="copycode2"){ensurePid();(navigator.clipboard?navigator.clipboard.writeText(myToken()):Promise.reject()).then(()=>toast(tr("copied"))).catch(()=>shareMsg(myToken()))}
  if(a==="fpaste"){let t=$("#fpaste").value;try{t=t+" "+decodeURIComponent(t)}catch(e){}if(!t.trim())return;const tok=parseToken(t),room=parseRoom(t);
    if(tok&&!room){if(tok.id===SAVE.pid){toast(tr("selfcode"));return}if(addFriend(tok.name,tok.id)){toast(tr("friendadded",{n:tok.name}));scrData.tab="f";render()}else toast(tr("already"));return}
    if(handlePasted(t)){scrData.tab="r";render()}else toast(tr("notrecog"))}
  if(a==="fduel"){const f=friendBy(d.id);if(f)challengeFriend(f)}
  if(a==="fdel"){const f=friendBy(d.id);if(f&&confirm(tr("confirmdel",{n:f.name}))){SAVE.friends=SAVE.friends.filter(x=>x.id!==d.id);save();render()}}
  if(a==="racc"){const r=SAVE.reqs[+d.i];if(!r)return;SAVE.reqs.splice(+d.i,1);
    if(r.k==="f"){addFriend(r.name,r.id);toast(tr("friendadded",{n:r.name}));save();render()}
    else{if(r.id&&!friendBy(r.id)&&r.id!==SAVE.pid)addFriend(r.name,r.id);save();openRoom(r.code)}}
  if(a==="rdec"){SAVE.reqs.splice(+d.i,1);save();render()}
  if(a==="addopp"){const T=DUEL.theirs;if(T&&addFriend(cleanName(T.nick),T.pid)){toast(tr("friendadded",{n:cleanName(T.nick)}));render()}}
  if(a==="g3d"){SAVE.opt.g3d=d.v==="1";save();render()}
  if(a==="dlsave")downloadSave();
  if(a==="copysave"){const c=exportCode();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast(tr("copied"))).catch(()=>{const t=$("#impc");t.value=c;t.select();toast(tr("copied"))})}
  if(a==="impcode"){if(importText($("#impc").value)){toast(tr("imported"));render()}else toast(tr("badsave"))}
  if(a==="reset"){if(confirm(tr("resetq"))){const l=LANG;SAVE=freshSave();SAVE.lang=l;save();flushCloud();toast(tr("resetdone"));go("home")}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="nick2"){SAVE.nick=e.target.value.trim().slice(0,16);save()}
  if(e.target.id==="ttl"||e.target.id==="ttl2"){SAVE.title=e.target.value;save()}
  if(e.target.id==="nick3"){SAVE.nick=cleanName(e.target.value);save();render()}
  if(e.target.id==="vmus"||e.target.id==="vsfx"){SAVE.opt[e.target.id==="vmus"?"music":"sfx"]=+e.target.value;save();auVolumes();SFX.tap()}
  if(e.target.id==="impf"){const f=e.target.files[0];if(!f)return;f.text().then(t=>{if(importText(t)){toast(tr("imported"));render()}else toast(tr("badsave"))})}
});
render();auMusic("menu");setTimeout(installHint,600);
document.addEventListener("input",e=>{if(e.target.id==="vmus"||e.target.id==="vsfx"){SAVE.opt[e.target.id==="vmus"?"music":"sfx"]=+e.target.value;auVolumes()}});

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
